name: Pages

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "example/**"
      - "pubspec.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "lib/**"
      - "example/**"
      - "pubspec.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # A project site is served from https://<user>.github.io/<repo>/, so the app
  # must be built for that subpath. Leading and trailing slash are both
  # required by `flutter build web --base-href`.
  BASE_HREF: /resizable_splitter/
  # example/lib holds exactly one runnable entrypoint today. Naming it
  # explicitly keeps the published site pinned to the showcase if more are
  # added later.
  ENTRYPOINT: lib/main.dart

jobs:
  build:
    name: Build showcase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency:
      # A new commit supersedes an older build of the same pull request. Main
      # builds serialize so an older build cannot reach production after a
      # newer one.
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate package metadata
        # example/lib/src/package_meta.dart is generated from the package's
        # pubspec and LICENSE, and the showcase renders its version, install
        # command, and links straight from it. The retired deploy script
        # regenerated it before every build; without this step the published
        # site would advertise whatever version was last committed rather than
        # the current one. Nothing is committed - the file is only regenerated
        # for this build.
        run: dart run tool/gen_package_meta.dart

      - name: Build
        # --wasm matches what the site has always shipped: it emits the
        # WasmGC bundle plus the JavaScript fallback for browsers without it.
        run: |
          flutter build web \
            --release \
            --wasm \
            --base-href "$BASE_HREF" \
            -t "$ENTRYPOINT"

      - name: Verify the built base href
        # A wrong base href is the failure mode for project sites: the page
        # loads, then every asset 404s and the app never paints. Cheaper to
        # fail here than to discover it as a white screen in production.
        run: |
          actual=$(grep -o '<base href="[^"]*">' build/web/index.html || true)
          expected="<base href=\"$BASE_HREF\">"
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected but the build produced ${actual:-no base href tag}."
            exit 1
          fi
          echo "$actual"

      - name: Verify the showcase entrypoint was built
        # Guards against -t being dropped or aimed at a valid-but-wrong file,
        # which would silently publish something other than the showcase. This
        # cannot be checked against index.html: example/web/index.html is
        # shared by every entrypoint, so the target leaves no trace in it. Only
        # the compiled output differs.
        #
        # MARKER is a user-visible string that exists solely in the showcase.
        # If this step fails after a copy edit, update MARKER to match.
        run: |
          MARKER="Every divider on this page is the package itself."
          if ! grep -qF "$MARKER" build/web/main.dart.js; then
            echo "Built output does not contain the showcase marker: $MARKER"
            echo "Either $ENTRYPOINT is no longer the showcase, or the copy changed."
            exit 1
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        # `path` is resolved from the repository root, not from
        # defaults.run.working-directory, which only applies to `run:` steps.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: example/build/web

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests and manual dispatches from non-main branches build and
    # verify, but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # GitHub Pages has one production target. Serialize every deployment
      # regardless of the triggering run or branch ref.
      group: pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
